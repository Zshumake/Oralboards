<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/Oralboards/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PM&R Oral Boards study tool for residency exam preparation.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1B3A5C">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PM&R Boards">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PM&R Oral Boards</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading screen while Flutter initializes */
    body { margin: 0; background: #FAF7F2; overflow: hidden; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #FAF7F2;
      font-family: Georgia, serif; color: #1B3A5C; z-index: 9999;
      transition: opacity 0.3s;
    }
    #loading h1 { font-size: 24px; font-weight: 700; margin: 0 0 8px; }
    #loading p { font-size: 14px; opacity: 0.6; margin: 0; }
    #loading .bar { width: 120px; height: 3px; background: #E8E2D9; border-radius: 2px; margin-top: 20px; overflow: hidden; }
    #loading .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #1B3A5C; border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div id="loading">
    <h1>PM&R Oral Boards</h1>
    <p>Preparing your study session...</p>
    <div class="bar"></div>
  </div>
  <script>
    // Remove loading screen once Flutter renders
    window.addEventListener('flutter-first-frame', () => {
      const el = document.getElementById('loading');
      if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
